# A vX.Y.Z tag on main ships to the Hetzner server; a manual run redeploys an existing tag (docs/deploy.md).
name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)deploy, e.g. v1.4.0. Reuses its images, skips checks and build.
        required: true
        type: string

permissions:
  contents: read

# One deploy at a time; a second one waits instead of racing the first.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_URL: https://app.bikecheck.cloud
  WEBSITE_URL: https://bikecheck.cloud

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a vX.Y.Z tag"; exit 1
          fi
          # Hotfixes go through main too, so a tag anywhere else is a mistake.
          if ! git merge-base --is-ancestor "refs/tags/$tag" origin/main; then
            echo "::error::$tag is not on main"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  checks:
    needs: release
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  images:
    needs: [release, checks]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: monolith
            context: _backend
            file: _backend/Dockerfile.prod
            runner: ubuntu-latest
            platform: linux/amd64
          - name: strava-service
            context: _backend
            file: _backend/Dockerfile.prod
            runner: ubuntu-latest
            platform: linux/amd64
          - name: caddy
            context: .
            file: docker/caddy.Dockerfile
            runner: ubuntu-latest
            platform: linux/amd64
          # Runs on the home Raspberry Pi (ADR 0042), so it is built natively on an ARM runner.
          - name: scraper
            context: _backend
            file: _backend/Dockerfile.prod
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          # Dockerfile.prod builds one app per image and ignores the rest; caddy bakes Umami into both
          # static builds from repo variables, an unset ID ships that build without the tracker.
          build-args: |
            APP=${{ matrix.name }}
            STATS_HOST=${{ vars.STATS_HOST }}
            TRACKER_SCRIPT_NAME=${{ vars.TRACKER_SCRIPT_NAME }}
            UMAMI_WEBSITE_ID_WEB=${{ vars.UMAMI_WEBSITE_ID_WEB }}
            UMAMI_WEBSITE_ID_APP=${{ vars.UMAMI_WEBSITE_ID_APP }}
          push: true
          tags: ghcr.io/jaffator/bikecheck-${{ matrix.name }}:${{ needs.release.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [release, images]
    # A manual redeploy skips checks and images, so "skipped" must not stop it; a failure does.
    if: ${{ !failure() && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy.sh on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command is deploy.sh; the tag is the only thing it is told.
          ssh -i ~/.ssh/deploy -o BatchMode=yes "deploy@$HOST" "$TAG"

      - name: Smoke check
        run: |
          for url in "$APP_URL/api/auth/test" "$APP_URL/" "$WEBSITE_URL/"; do
            for _ in $(seq 1 24); do
              if curl -fsS -o /dev/null --max-time 10 "$url"; then
                echo "ok  $url"; continue 2
              fi
              sleep 5
            done
            echo "::error::$url did not answer 200 within 2 minutes"; exit 1
          done
