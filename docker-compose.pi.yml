# The bike scraper on the home Raspberry Pi (ADR 0042); the monolith on Hetzner calls it over Tailscale.
# On the Pi: docker compose --env-file .env.pi -f docker-compose.pi.yml up -d  (see docs/deploy.md)
services:
  scraper:
    image: ghcr.io/jaffator/bikecheck-scraper:${TAG:?TAG must name a release, see docs/deploy.md}
    platform: linux/arm64
    restart: unless-stopped
    command: ["node", "dist/apps/scraper/main.js"]
    environment:
      NODE_ENV: production
      PORT: "3003"
      SCRAPER_API_SECRET: ${SCRAPER_API_SECRET:?the shared secret, also in the server's .env.production}
    # The Pi runs 32-bit Raspbian, whose armhf seccomp profile kills the syscalls of this arm64 image.
    security_opt: [seccomp:unconfined]
    # Playwright: Chromium runs out of memory without the host IPC namespace; init reaps its zombies.
    ipc: host
    init: true
    # All interfaces, not the Tailscale IP: Docker can start before tailscaled has it and then fail
    # to bind. The router forwards nothing here and every call needs the secret.
    ports:
      - "3003:3003"

  # Pi metrics, container logs and the outside probe of prod, to Grafana Cloud (docker/alloy/config.pi.alloy).
  # Host namespaces, privileged and the Docker socket as on the server; seccomp as for the scraper.
  alloy:
    image: grafana/alloy:v1.20.1
    platform: linux/arm64
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    env_file: .env.pi
    security_opt: [seccomp:unconfined]
    pid: host
    network_mode: host
    privileged: true
    volumes:
      - ./docker/alloy/config.pi.alloy:/etc/alloy/config.alloy:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /run/udev/data:/run/udev/data:ro
      - alloy_data:/var/lib/alloy/data

volumes:
  alloy_data:
