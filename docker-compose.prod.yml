# Production stack (docs/research/hosting.md §5): Caddy is the only thing on the host's ports.
# CI builds the app images into GHCR, one tag per release; the server only pulls them (docs/deploy.md).
# scripts/deploy.sh runs it; by hand, add `--env-file .env.tag` for the running release's TAG.
# .env.production is git-ignored; .env.production.example lists every variable.
services:
  db-monolith:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: monolith
    volumes:
      - pgdata_monolith:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d monolith"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  db-strava-service:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: strava_service
    volumes:
      - pgdata_strava_service:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d strava_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  db-umami:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: umami
    volumes:
      - pgdata_umami:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Cookieless visitor stats for the Marketing Website and the App, behind Caddy on STATS_HOST.
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-umami:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      # Neutral names, so ad blockers that match script.js and /api/send let them through.
      TRACKER_SCRIPT_NAME: ${TRACKER_SCRIPT_NAME}
      COLLECT_API_ENDPOINT: ${COLLECT_API_ENDPOINT}
      DISABLE_TELEMETRY: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db-umami:
        condition: service_healthy
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF so delayed BullMQ jobs (plan reminders) survive a crash, not just a clean stop.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  monolith:
    image: ghcr.io/jaffator/bikecheck-monolith:${TAG:?TAG must name a release, see docs/deploy.md}
    restart: unless-stopped
    # Playwright: Chromium runs out of memory without the host IPC namespace; init reaps its zombies.
    ipc: host
    init: true
    # `exec` replaces sh with node, so Docker's SIGTERM reaches Nest's shutdown hooks instead of sh.
    command: ["sh", "-c", "npx prisma migrate deploy --config apps/monolith/prisma.config.ts && exec node dist/apps/monolith/src/main.js"]
    env_file: .env.production
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-monolith:5432/monolith
      REDIS_HOST: redis
      # Internal calls to the strava-service never leave the compose network.
      STRAVA_SERVICE_URL: http://strava-service:3002
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      SPA_INDEX_HTML: /srv/spa/index.html
    volumes:
      - ./_frontend/bikecheck/dist:/srv/spa:ro
    depends_on:
      db-monolith:
        condition: service_healthy
      redis:
        condition: service_healthy
      strava-service:
        condition: service_started
    networks: [internal]

  strava-service:
    image: ghcr.io/jaffator/bikecheck-strava-service:${TAG:?TAG must name a release, see docs/deploy.md}
    restart: unless-stopped
    # A real PID 1 that forwards SIGTERM and reaps zombies, as on the monolith.
    init: true
    command: ["sh", "-c", "npx node-pg-migrate up -m apps/strava-service/migrations && exec node dist/apps/strava-service/main.js"]
    env_file: .env.production
    environment:
      PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-strava-service:5432/strava_service
      REDIS_HOST: redis
      # Here it is the public base of the OAuth redirect_uri Strava sends the browser back to.
      STRAVA_SERVICE_URL: ${PUBLIC_APP_URL}
    depends_on:
      db-strava-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: ghcr.io/jaffator/bikecheck-caddy:${TAG:?TAG must name a release, see docs/deploy.md}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEBSITE_HOST: ${WEBSITE_HOST}
      PUBLIC_HOST: ${PUBLIC_HOST}
      STATS_HOST: ${STATS_HOST}
      OPS_USER: ${OPS_USER}
      OPS_PASSWORD_HASH: ${OPS_PASSWORD_HASH}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - monolith
      - strava-service
      - umami
    networks: [internal]

  # Metrics and logs to Grafana Cloud. Host namespaces so it reads the server's own CPU, RAM and network;
  # privileged + the Docker socket for per-container stats and logs (cAdvisor needs both).
  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    env_file: .env.production
    pid: host
    network_mode: host
    privileged: true
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /run/udev/data:/run/udev/data:ro
      - alloy_data:/var/lib/alloy/data

networks:
  internal:

volumes:
  alloy_data:
  pgdata_monolith:
  pgdata_strava_service:
  pgdata_umami:
  redis_data:
  caddy_data:
  caddy_config:
