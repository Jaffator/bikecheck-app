      }
      .part-card {
        background: #262524;
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: border-color 0.2s ease, background-color 0.2s ease;
      }
      .part-card:nth-of-type(even) {
        background: #2d2722;
      }
      .part-card:hover {
        border-color: rgba(206, 192, 83, 0.28);
      }
      .part-card[open] {
        border-color: rgba(206, 192, 83, 0.22);
      }
      .part-card[open] .part-chev {
        transform: rotate(180deg);
      }
      .part-chev {
        transition: transform 0.22s ease;
      }
      /* Garage cards share the part-card surface but not its banding. */
      .bike-card {
        background: #262524;
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: border-color 0.2s ease;
      }
      .bike-card:hover {
        border-color: rgba(206, 192, 83, 0.28);
      }
      .part-card > summary {
        list-style: none;
        cursor: pointer;
        min-height: 56px;
      }
      .part-card > summary::-webkit-details-marker {
        display: none;
      }
      .rail {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .rail::-webkit-scrollbar {
        display: none;
      }
      .chip[aria-current="true"],
      .seg[aria-current="true"] {
        background: #cec053;
        color: #050505;
        border-color: #cec053;
      }
      .navlink[aria-current="true"] {
        color: #cec053;
        border-left-color: #cec053;
        background: rgba(206, 192, 83, 0.06);
      }
      .token {
        min-inline-size: 0;
        overflow-wrap: anywhere;
      }
      [data-lang="cs"] .lang-en {
        display: none;
      }
      [data-lang="en"] .lang-cs {
        display: none;
      }
      /* Poster card (variant C): the name sits on the photo, so the photo needs a floor to hold it. */
      .poster-fade {
        background: linear-gradient(180deg, rgba(10, 10, 11, 0) 35%, rgba(10, 10, 11, 0.92) 100%);
      }
      /* Setup comparison table (variant B). */
      .setup-table th,
      .setup-table td {
        padding: 9px 12px;
        text-align: right;
        white-space: nowrap;
      }
      .setup-table th:first-child,
      .setup-table td:first-child {
        text-align: left;
      }
      .setup-table tbody tr {
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      /* ---- Prototype bar: deliberately not part of the design under review. */
      #proto-bar {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 200;
        max-width: calc(100% - 32px);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border-radius: 14px;
        background: #f5f5f0;
        color: #111;
        font: 500 12px/1.2 system-ui, sans-serif;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 0, 0, 0.3);
      }
      #proto-bar button {
        border: 1px solid #c8c8c0;
        background: #fff;
        color: #111;
        border-radius: 8px;
        padding: 6px 9px;
        min-height: 32px;
        cursor: pointer;
        font: inherit;
      }
      #proto-bar button[aria-pressed="true"] {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      #proto-bar .variant {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 4px;
        border-left: 1px solid #c8c8c0;
        border-right: 1px solid #c8c8c0;

      #proto-bar .variant .label {
        min-width: 150px;
        text-align: center;

        display: block;
        font-weight: 400;
        color: #555;
        font-size: 10px;
      }

      @media (prefers-reduced-motion: reduce) {

        }

        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }

    <script>
      (function () {
        "use strict";
        var root = document.documentElement;

        /* ---- URL state ----------------------------------------------------
           view=garage|bike · bike=<id> · variant=A|B|C · lang=cs|en ·
           sections=p s h c (parts / setup / history / costs; absent letter = off) */
        function readState() {
          var q = new URLSearchParams(location.search);
          var s = q.get("sections");
          return {
            view: q.get("view") === "bike" ? "bike" : "garage",
            bike: q.get("bike") || "rallon",
            variant: ["A", "B", "C"].indexOf(q.get("variant")) >= 0 ? q.get("variant") : "A",
            lang: q.get("lang") === "en" ? "en" : "cs",
            parts: s === null ? true : s.indexOf("p") >= 0,
            setup: s === null ? true : s.indexOf("s") >= 0,
            history: s === null ? true : s.indexOf("h") >= 0,
            costs: s === null ? false : s.indexOf("c") >= 0,
          };
        }
        var state = readState();
        var historyShown = {}; // bike id -> services shown (pagination is not URL state)

        function query(over) {
          var s = Object.assign({}, state, over || {});
          var q = new URLSearchParams();
          q.set("view", s.view);
          if (s.view === "bike") q.set("bike", s.bike);
          q.set("variant", s.variant);
          q.set("lang", s.lang);
          q.set("sections", (s.parts ? "p" : "") + (s.setup ? "s" : "") + (s.history ? "h" : "") + (s.costs ? "c" : ""));
          return "?" + q.toString();
        }
        function setState(over) {
          Object.assign(state, over);
          history.replaceState(null, "", query());
          render();
        }

        /* ---- Copy helpers ------------------------------------------------- */
        function t(o) {
          return '<span class="lang-cs">' + o.cs + '</span><span class="lang-en">' + o.en + "</span>";
        }
        function L(cs, en) {
          return t({ cs: cs, en: en });
        }
        function num(n) {
          return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        }
        function money(n) {
          return num(n) + '<span class="ml-1 text-[11px] text-paper-dim">Kč</span>';
        }
        // Tyres are stored in psi and read in the owner's unit (bar here); suspension stays psi.
        function bar(psi) {
          var b = (psi * 0.0689476).toFixed(2);
          return L(b.replace(".", ",") + " bar", b + " bar");
        }
        var MONTHS = {
          cs: ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"],
          en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
        };
        var MONTHS_SHORT_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        function fmtDate(iso) {
          var p = iso.split("-");
          return L(+p[2] + ". " + +p[1] + ". " + p[0], +p[2] + " " + MONTHS_SHORT_EN[+p[1] - 1] + " " + p[0]);
        }
        function monthLabel(iso) {
          var p = iso.split("-");
          return L(MONTHS.cs[+p[1] - 1] + " " + p[0], MONTHS.en[+p[1] - 1] + " " + p[0]);
        }
        function plural(n, one, few, many) {
          return n === 1 ? one : n >= 2 && n <= 4 ? few : many;
        }

        /* ---- Data ---------------------------------------------------------- */
        var OWNER = {
          name: "Jarda L.",
          handle: "jardal",
          initials: "JL",
          updated: { cs: "před 3 dny", en: "3 days ago" },
          updatedAbs: { cs: "15. 9. 2026", en: "15 Sep 2026" },
        };

        var ACT = {
          swap: { cs: "výměna dílu", en: "part swap" },
          geo: { cs: "kontrola geometrie", en: "geometry check" },
          sealant: { cs: "doplnění tmelu", en: "sealant top-up" },
          oil: { cs: "výměna oleje", en: "oil change" },
          seals: { cs: "výměna prachovek", en: "seal change" },

        /* ---- Bike page: setup (three placements) --------------------------------- */

          var g = [{ id: "tyres", icon: "i-wheels", label: { cs: "Pláště", en: "Tyres" }, rows: [["ft", { cs: "Přední", en: "Front" }, "bar"], ["rt", { cs: "Zadní", en: "Rear" }, "bar"]] }];

              '<dl class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-4 sm:gap-3 lg:grid-cols-7">' +

              g.rows.map(function (r) {
                return "<tr><td class=\"text-[13px] text-paper-dim\">" + t(r[1]) + "</td>" +

        function setupC(b) {

          var p = b.profiles[cur];
          var dials = [["ft", { cs: "Přední plášť", en: "Front tyre" }, "bar"], ["rt", { cs: "Zadní plášť", en: "Rear tyre" }, "bar"]];
          if (b.front) dials.push(["fp", { cs: "Vidlice", en: "Fork" }, "psi"], ["fsag", { cs: "Sag vidlice", en: "Fork sag" }, "%"]);
          if (b.rear) dials.push(["sp", { cs: "Tlumič", en: "Shock" }, "psi"], ["ssag", { cs: "Sag tlumiče", en: "Shock sag" }, "%"]);
          var clicks = [];
          if (b.front) clicks.push({ label: { cs: "Vidlice", en: "Fork" }, rows: FORK_ROWS.slice(1) });
          if (b.rear) clicks.push({ label: { cs: "Tlumič", en: "Shock" }, rows: SHOCK_ROWS.slice(1) });
          return (
            '<div id="setup" class="glass mt-8 rounded-2xl p-4 sm:p-5 lg:mt-10">' +
            '<div class="flex flex-wrap items-center gap-3"><span class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-card-inset text-gold-500"><svg class="size-[18px]" aria-hidden="true"><use href="#i-dial" /></svg></span>' +
            '<h2 class="font-display text-[19px] font-bold tracking-tight">Setup</h2>' +
            (b.profiles.length > 1 ? profileTabs(b, cur, "ml-auto") : "") + "</div>" +
            '<dl class="mt-4 grid grid-cols-2 gap-x-4 gap-y-4 sm:grid-cols-3 lg:grid-cols-6">' +
            dials.map(function (r) {
              // Tyre dials carry the mounted tyre itself, as the build row shows it.
              var tyre = r[0] === "ft" ? mountedPart(b, "Plášť přední") : r[0] === "rt" ? mountedPart(b, "Plášť zadní") : null;
              return reading(r[1], setupValue(p, r), "", "text-[18px] sm:text-[20px]") .replace("</dd></div>",
                (tyre ? '</dd><dd class="mt-1.5 token text-[13px] leading-snug"><span class="font-semibold">' + tyre.brand + '</span> <span class="text-paper-dim">' + tyre.model + '</span><span class="block font-mono text-[11px] text-paper-dim">' + tyre.spec + "</span></dd></div>" : "</dd></div>"));
            }).join("") + "</dl>" +
            (clicks.length
              ? '<details class="mt-4 border-t hairline pt-3"><summary class="cursor-pointer list-none font-mono text-[11px] uppercase tracking-wider text-paper-dim hover:text-paper">' + L("Tokeny a kliky (od plně zavřeného)", "Tokens and clicks (from fully closed)") + "</summary>" +
                '<div class="mt-3 grid gap-4 sm:grid-cols-2">' + clicks.map(function (c) {
                  return '<dl class="grid grid-cols-3 gap-x-3 gap-y-2"><dt class="col-span-3 font-mono text-[10px] uppercase tracking-[0.14em] text-gold-500">' + t(c.label) + "</dt>" +
                    c.rows.map(function (r) { return '<div><dt class="font-mono text-[10px] text-paper-faint">' + t(r[1]) + '</dt><dd class="font-mono text-[13px] tabular-nums">' + setupValue(p, r) + "</dd></div>"; }).join("") + "</dl>";
                }).join("") + "</div></details>"
              : "") +
            "</div>"
          );
        }

        /* ---- Bike page: service history (#117) ----------------------------------- */
        var PAGE = 20;
        function svcRow(s) {
          var v = state.variant;
          var actions = s.actions.map(function (a) { return ACT[a]; });
          var parts = s.parts.map(function (p) { return PART[p]; });
          var price = state.costs && s.price !== null ? '<p class="ml-auto font-mono text-[12px] tabular-nums text-gold-500">' + money(s.price) + "</p>" : "";
          var swapBadge = s.replacement ? '<span class="rounded-md border border-gold-500/40 px-1.5 py-0.5 font-mono text-[9px] uppercase tracking-[0.14em] text-gold-500">' + L("Výměna", "Swap") + "</span>" : "";
          var date = '<p class="font-mono text-[11px] tabular-nums text-paper-dim">' + (s.date ? fmtDate(s.date) : "—") + "</p>";
          function chipList(items, cls) {
            return '<ul class="flex flex-wrap gap-1.5">' + items.map(function (i) { return '<li class="rounded-md px-2 py-1 font-mono text-[10px] ' + cls + '">' + t(i) + "</li>"; }).join("") + "</ul>";
          }
          var inner;
          if (v === "A") {
            // Title composed from the action names; parts as chips under it.
            inner =
              '<div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">' + date +
              '<p class="text-[15px] font-semibold leading-snug">' + actions.map(function (a) { return t(a); }).join(' <span class="text-paper-faint">·</span> ') + "</p>" + swapBadge + price + "</div>" +
              '<div class="mt-3">' + chipList(parts, "bg-card-inset text-paper-dim") + "</div>";
          } else if (v === "B") {
            // No title: actions are chips, parts stay a text line as in the design.
            inner =
              '<div class="flex flex-wrap items-center gap-x-3 gap-y-2">' + date + chipList(actions, "border border-gold-500/25 bg-gold-500/5 text-gold-300") + swapBadge + price + "</div>" +
              '<p class="mt-3 token font-mono text-[11px] leading-relaxed text-paper-dim">' + L("Dotčené díly: ", "Parts touched: ") + '<span class="text-paper">' + parts.map(function (p) { return t(p); }).join(" · ") + "</span></p>";
          } else {
            // Part-centric: parts are the title, actions the eyebrow above it.
            inner =
              '<div class="flex flex-wrap items-center gap-x-3 gap-y-1">' + date +
              '<p class="font-mono text-[10px] uppercase tracking-[0.14em] text-paper-dim">' + actions.map(function (a) { return t(a); }).join(" · ") + "</p>" + swapBadge + price + "</div>" +
              '<p class="mt-1.5 text-[15px] font-semibold leading-snug">' + parts.map(function (p) { return t(p); }).join(", ") + "</p>";
          }
          return '<li class="svc-row rounded-xl border hairline bg-card p-4">' + inner + "</li>";
        }
        function historySection(b) {
          var shown = Math.min(historyShown[b.id] || PAGE, b.services.length);
          var slice = b.services.slice(0, shown);
          var groups = [];
          slice.forEach(function (s) {
            var key = s.date ? s.date.slice(0, 7) : "none";
            var g = groups[groups.length - 1];
            if (!g || g.key !== key) {
              g = { key: key, label: s.date ? monthLabel(s.date) : L("Datum neuvedeno", "Date not given"), items: [], total: 0 };
              groups.push(g);
            }
            g.items.push(s);
            g.total += s.price || 0;
          });
          var list = groups.map(function (g) {
            return (
              '<div><div class="flex items-baseline justify-between gap-4 border-b hairline pb-2"><h3 class="font-mono text-[11px] uppercase tracking-[0.16em] ' + (g.key === "none" ? "text-paper-faint" : "text-gold-500") + '">' + g.label + "</h3>" +
              (state.costs && g.total ? '<p class="font-mono text-[12px] tabular-nums text-paper-dim">' + money(g.total) + "</p>" : "") + "</div>" +
              '<ul class="mt-3 space-y-1.5">' + g.items.map(svcRow).join("") + "</ul></div>"
            );
          }).join("");
          var rest = b.services.length - shown;
          var tiles =
            '<div class="rounded-xl border hairline bg-card px-3 py-3 sm:px-4"><dt class="font-mono text-[10px] uppercase tracking-[0.14em] text-paper-dim">' + L("Servisů", "Services") + '</dt><dd class="mt-1 whitespace-nowrap font-mono text-[17px] tabular-nums leading-none sm:text-[20px]">' + b.services.length + "</dd></div>" +
            '<div class="rounded-xl border hairline bg-card px-3 py-3 sm:px-4"><dt class="font-mono text-[10px] uppercase tracking-[0.14em] text-paper-dim">' + L("Výměn", "Swaps") + '</dt><dd class="mt-1 whitespace-nowrap font-mono text-[17px] tabular-nums leading-none sm:text-[20px]">' + swapCount(b) + "</dd></div>" +
            (state.costs ? '<div class="rounded-xl border hairline bg-card px-3 py-3 sm:px-4"><dt class="font-mono text-[10px] uppercase tracking-[0.14em] text-paper-dim">' + L("Útrata", "Spent") + '</dt><dd class="mt-1 whitespace-nowrap font-mono text-[17px] tabular-nums leading-none sm:text-[20px]">' + money(spent(b)) + "</dd></div>" : "");
          return (
            '<section id="servis" class="border-t hairline bg-ink-900/40 scroll-mt-32"><div class="mx-auto max-w-content px-4 py-10 sm:px-6 sm:py-14 lg:px-8 lg:py-16">' +
            '<h2 class="font-display text-[26px] font-extrabold tracking-tight sm:text-[34px]">' + L("Servisní historie", "Service history") + "</h2>" +
            '<dl class="mt-6 grid gap-2 sm:max-w-xl sm:gap-3 ' + (state.costs ? "grid-cols-3" : "grid-cols-2 sm:max-w-sm") + '">' + tiles + "</dl>" +
            '<div class="mt-8 space-y-8">' + list + "</div>" +
            (rest > 0
              ? '<button type="button" id="btn-older" class="mt-8 inline-flex min-h-[48px] w-full items-center justify-center gap-2 rounded-xl border hairline-strong px-5 text-[15px] font-medium text-paper transition-colors hover:border-gold-500/40 sm:w-auto">' +
                L("Zobrazit starší", "Show older") + '<span class="font-mono text-[12px] tabular-nums text-paper-dim">' + rest + "</span></button>"
              : "") +
            "</div></section>"
          );
        }

        /* ---- Page assembly --------------------------------------------------------- */
        function render() {
          root.setAttribute("data-lang", state.lang);
          root.setAttribute("lang", state.lang);
          var v = state.variant;
          var html;
          var b = bikeById(state.bike);
          if (state.view === "garage") {
            html = renderHeader(b) + "<main>" + (v === "A" ? garageA() : v === "B" ? garageB() : garageC()) + "</main>" + renderFooter(v !== "A");
          } else {
            var hasSetup = state.setup && b.profiles.length > 0;
            html =
              renderHeader(b) + "<main>" + bikeHero(b) +
              (state.parts ? buildSection(b) : "") +
              (hasSetup && v === "A" ? setupA(b) : "") +
              (hasSetup && v === "B" ? setupB(b) : "") +
              (state.history ? historySection(b) : "") +
              "</main>" + renderFooter(v !== "A");
          }
          document.getElementById("app").innerHTML = html;
          document.title = (state.view === "garage" ? OWNER.name : b.brand + " " + b.model) + " — BikeCheck";
          wire(b);
          renderBar();
        }

        function wire(b) {
          document.getElementById("btn-lang").addEventListener("click", function () {
            setState({ lang: state.lang === "cs" ? "en" : "cs" });
          });
          document.getElementById("btn-copy").addEventListener("click", function () {
            var toast = document.getElementById("copy-toast");
            var done = function (ok) {
              toast.textContent = state.lang === "cs" ? (ok ? "Odkaz zkopírován do schránky" : "Odkaz se nepodařilo zkopírovat") : ok ? "Link copied to clipboard" : "Could not copy the link";
              toast.classList.remove("hidden");
              setTimeout(function () { toast.classList.add("hidden"); }, 2200);
            };
            if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function () { done(true); }, function () { done(false); });
            else done(false);
          });
          var expand = document.getElementById("btn-expand");
          if (expand) {
            expand.addEventListener("click", function () {
              var open = expand.getAttribute("aria-expanded") !== "true";
              document.querySelectorAll(".part-card").forEach(function (d) { d.open = open; });
              expand.setAttribute("aria-expanded", String(open));
              expand.querySelector(".lang-cs").textContent = open ? "Sbalit vše" : "Rozbalit vše";
              expand.querySelector(".lang-en").textContent = open ? "Collapse all" : "Expand all";
            });
          }
          var older = document.getElementById("btn-older");
          if (older) {
            older.addEventListener("click", function () {
              historyShown[b.id] = (historyShown[b.id] || PAGE) + PAGE;
              var y = window.scrollY;
              render();
              window.scrollTo(0, y);
            });
          }
          document.querySelectorAll("[data-profile]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              b._profile = +btn.getAttribute("data-profile");
              var y = window.scrollY;
              render();
              window.scrollTo(0, y);
            });
          });
        }

        /* ---- Prototype bar (never part of the design under review) ---------------- */
        var ORDER = ["A", "B", "C"];
        function renderBar() {
          var lang = state.lang;
          var vi = ORDER.indexOf(state.variant);
          var vdef = VARIANTS[state.variant];
          function tog(key, cs, en) {
            return '<button type="button" data-tog="' + key + '" aria-pressed="' + state[key] + '">' + (lang === "cs" ? cs : en) + "</button>";
          }
          document.getElementById("proto-bar").innerHTML =
            '<button type="button" data-view="garage" aria-pressed="' + (state.view === "garage") + '">' + (lang === "cs" ? "Garáž" : "Garage") + "</button>" +
            '<button type="button" data-view="bike" aria-pressed="' + (state.view === "bike") + '">' + (lang === "cs" ? "Kolo" : "Bike") + "</button>" +
            '<span class="variant"><button type="button" data-step="-1" aria-label="Previous variant">&#9664;</button>' +
            '<span class="label">' + state.variant + " — " + vdef[lang] + "<small>" + vdef.sub[lang] + "</small></span>" +
            '<button type="button" data-step="1" aria-label="Next variant">&#9654;</button></span>' +
            tog("parts", "Komponenty", "Parts") + tog("setup", "Setup", "Setup") + tog("history", "Servis", "History") + tog("costs", "Ceny", "Costs") +
            '<button type="button" data-lang>' + (lang === "cs" ? "EN" : "CS") + "</button>";
        }
        document.getElementById("proto-bar").addEventListener("click", function (e) {
          var btn = e.target.closest("button");
          if (!btn) return;
          if (btn.hasAttribute("data-view")) {
            setState({ view: btn.getAttribute("data-view") });
            window.scrollTo(0, 0);
          } else if (btn.hasAttribute("data-step")) {
            step(+btn.getAttribute("data-step"));
          } else if (btn.hasAttribute("data-tog")) {
            var k = btn.getAttribute("data-tog");
            var o = {};
            o[k] = !state[k];
            setState(o);
          } else if (btn.hasAttribute("data-lang")) {
            setState({ lang: state.lang === "cs" ? "en" : "cs" });
          }
        });
        function step(d) {
          var i = (ORDER.indexOf(state.variant) + d + ORDER.length) % ORDER.length;
          var y = window.scrollY;
          setState({ variant: ORDER[i] });
          window.scrollTo(0, y);
        }
        document.addEventListener("keydown", function (e) {
          var el = document.activeElement;
          if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return;
          if (e.key === "ArrowLeft") step(-1);
          if (e.key === "ArrowRight") step(1);
        });

        render();
      })();
    </script>
    <!-- ARTIFACT-BODY-END -->
  </body>
</html>
