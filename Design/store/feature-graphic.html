<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<title>BikeCheck feature graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #141416;
    --bg-deep: #050506;
    --yellow: #cec053;
    --text: #ffffff;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden;
    background: var(--bg-deep);
    font-family: "Roboto", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  /* same stage as the closing screenshot: black on top, lifting slightly towards the floor */
  .stage {
    position: relative; width: 1024px; height: 500px;
    background:
      radial-gradient(700px 400px at 30% 100%, #26272b 0%, rgba(38,39,43,0) 70%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep) 30%, var(--bg) 100%);
  }
  /* the phone-and-bike composite, cropped to the phone screen and the fork, fading on every edge */
  .hero {
    position: absolute; right: -110px; top: -250px; width: 600px;
    -webkit-mask-image:
      linear-gradient(90deg, transparent, #000 170px, #000 calc(100% - 60px), transparent),
      linear-gradient(180deg, transparent 250px, #000 330px, #000 650px, transparent 750px);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(90deg, transparent, #000 170px, #000 calc(100% - 60px), transparent),
      linear-gradient(180deg, transparent 250px, #000 330px, #000 650px, transparent 750px);
    mask-composite: intersect;
  }
  .content {
    position: absolute; left: 72px; top: 0; height: 500px; width: 470px;
    display: flex; flex-direction: column; justify-content: center; gap: 26px;
  }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo img { width: 48px; height: 48px; }
  .logo span { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
  .headline {
    font-size: 46px; font-weight: 700; line-height: 1.1; white-space: nowrap; letter-spacing: -0.02em;
  }
  .headline b { color: var(--yellow); font-weight: 700; }
</style>
</head>
<body>
<div class="stage">
  <img class="hero" src="screens/08-closing.jpg" alt="" />
  <div class="content">
    <div class="logo"><img src="../../_frontend/bikecheck/src/assets/logo_only.svg" alt="" /><span>BikeCheck</span></div>
    <div class="headline" data-cs="Život tvého kola<br><b>na jednom místě</b>" data-en="Your bike's life<br><b>in one place</b>"></div>
  </div>
</div>
<script>
  const lang = new URLSearchParams(location.search).get("lang") || "cs";
  const h = document.querySelector(".headline");
  h.innerHTML = h.dataset[lang];
  document.documentElement.lang = lang;
</script>
</body>
</html>
